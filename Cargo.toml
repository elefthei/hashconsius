[package]
name = "hashconsius"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Formally verified (Verus) hash consing with heap and fixed-capacity arena consigns"
repository = "https://github.com/elefthei/hashconsius"
readme = "README.md"
keywords = ["hashconsing", "arena", "verus", "verified", "no-std"]
categories = ["data-structures", "memory-management", "no-std"]

[features]
default = ["std"]
std = ["vstd/std"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false, features = ["alloc"] }
bumpus = "=0.1.1"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
