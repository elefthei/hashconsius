[package]
name = "hashconsius"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = ["vstd/std"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false, features = ["alloc"] }
verus-bumpalo = { git = "https://github.com/elefthei/bumpus", rev = "888a6983370524cf1686d82e5814dd17a2dd14e5" }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
